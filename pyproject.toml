[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "spectralab"
version = "0.1.0"
description = "Studio desktop d'analyse, de restauration et de protection de médias (image, audio, vidéo)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "VISCHENZISCH" }]
dependencies = [
    "PySide6>=6.8,<7",
    "Pillow>=10.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.gui-scripts]
spectralab = "spectralab.app:main"

[tool.setuptools.packages.find]
include = ["spectralab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"spectralab.ui" = ["assets/*.svg"]
